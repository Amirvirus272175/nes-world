name: iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS IPA Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 NESWorld.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESWorld-iOS
          path: build/ios/iphoneos/NESWorld.ipa
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/ios/iphoneos/NESWorld.ipa
          tag_name: v1.0.0-ios-${{ github.run_number }}
          body: "NES World iOS IPA Build #${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
